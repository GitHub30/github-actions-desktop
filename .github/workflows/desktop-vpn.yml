name: Desktop VPN

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Start Docker
        background: true
        run: |
          docker run -d \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            ghcr.io/linuxserver/webtop

      - name: Start VPN and collect warp diagnostics
        run: |
          set -euxo pipefail

          # install
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

          # try register/connect but don't fail the job if these fail
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos connect || true

          # Diagnostics (corrected commands)
          echo "==== warp-cli help ===="; sudo warp-cli --help || true
          echo "==== warp-cli status ===="; sudo warp-cli status || true

          echo "==== systemctl status warp-svc ===="; sudo systemctl status warp-svc --no-pager || true
          echo "==== journalctl warp-svc (last 500 lines) ===="; sudo journalctl -u warp-svc --no-pager -n 500 || true

          echo "==== /dev/net/tun ===="; ls -l /dev/net/tun || true
          echo "==== lsmod ===="; sudo lsmod | egrep 'wireguard|tun' || true
          echo "==== ip a ===="; ip a || true
          echo "==== ip route ===="; ip route || true
          echo "==== ip rule ===="; ip rule || true

          echo "==== nft ruleset ===="; sudo nft list ruleset || true
          echo "==== iptables nat ===="; sudo iptables -t nat -L -n -v || true
          echo "==== ss -tunlp ===="; sudo ss -tunlp || true

          # Save all diagnostics
          {
            date
            echo '==== warp-cli --help ===='; sudo warp-cli --help || true
            echo '==== warp-cli status ===='; sudo warp-cli status || true
            echo '==== systemctl status warp-svc ===='; sudo systemctl status warp-svc --no-pager || true
            echo '==== journalctl warp-svc ===='; sudo journalctl -u warp-svc --no-pager -n 500 || true
            echo '==== /dev/net/tun ===='; ls -l /dev/net/tun || true
            echo '==== lsmod ===='; sudo lsmod | egrep \"wireguard|tun\" || true
            echo '==== ip a ===='; ip a || true
            echo '==== ip route ===='; ip route || true
            echo '==== ip rule ===='; ip rule || true
            echo '==== nft ruleset ===='; sudo nft list ruleset || true
            echo '==== iptables nat ===='; sudo iptables -t nat -L -n -v || true
            echo '==== ss -tunlp ===='; sudo ss -tunlp || true
          } > /tmp/warp-diagnostics.log 2>&1 || true

          # try curl with verbose and retries
          curl --retry 5 --retry-delay 5 --max-time 30 -v https://www.cloudflare.com/cdn-cgi/trace || true
      - name: Upload warp diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: warp-diagnostics
          path: /tmp/warp-diagnostics.log

      - name: Desktop URL https://<random-subdomain>.trycloudflare.com
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1
          cloudflared tunnel --url http://localhost:3000
